product:
  type: jvm/app
dependencies:
  - $libs.clikt.jvm
  - $libs.logback.core
  - $libs.logback.classic
  - $libs.slf4j.api
  - $libs.dependency.resolution
  - $libs.async.processes
  - $libs.kotlinx.coroutines.core.jvm
  - $kotlin.serialization.json
test-dependencies:
  - $kotlin.test
  - $libs.kotlin.tooling.core
repositories:
  - https://packages.jetbrains.team/maven/p/amper/amper
settings:
  kotlin:
    version: 2.4.21
    serialization: enabled
  jvm:
    release: 21
plugins:
  # `./kotlin do updateGradleGoldenData` re-resolves the Gradle test projects with their own Gradle wrapper, updating the
  # golden data the resolver tests compare against.
  gradle-golden-data:
    enabled: true
    gradleProjectsDirectory: testResources/gradleProjects
  # `./kotlin do format` runs the ktfmt native binary (kotlinlang style) over the Kotlin sources. ktfmt publishes no
  # binary for linux-arm64 or macos-x64: formatting fails there.
  # sha256 values from the .sha256 assets of https://github.com/Kotlin/ktfmt/releases/tag/v0.65
  format:
    enabled: true
    ktfmt:
      version: "0.65"
      archives:
        - os: linux
          arch: x64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-linux-x86_64-0.65.tar.gz
          sha256: 3684327b092db9b76fffcb9525decf73f8331ed17e00ce3232769c11cd36d352
          executablePath: ktfmt-linux-x86_64-0.65/ktfmt
        - os: macos
          arch: arm64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-macos-aarch64-0.65.tar.gz
          sha256: d10ec46dadc4ae19e5b8ddc72d10ce45e5be35d632ce9e73c9b8a59d2147fb85
          executablePath: ktfmt-macos-aarch64-0.65/ktfmt
        - os: windows
          arch: x64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-windows-x86_64-0.65.zip
          sha256: 3286d659fa8df6a480e3b53ca4a30d9321c372286c46b8d74556b434189bee5f
          executablePath: ktfmt-windows-x86_64-0.65/ktfmt.exe
    directories:
      - src
      - test
      - build-sources
  native-image:
    enabled: true
    graalVmVersion: 25.5.5.0.3
    mainClass: org.jetbrains.kmp.resolver.MainKt
    outputDirectory: build/native-image
    test:
      nodeDistributionPropertiesFile: build/node/generated-resources/node-distribution.properties
      goldenManifestFile: testResources/manifest-coroutines_ios_wasmjs_jvm.json
    archives:
      - os: linux
        arch: x64
        url: https://gds.oracle.com/download/graal/25i5/archive/graalvm-jdk-25i5-25.0.5.0.3_linux-x64_bin.tar.gz
        sha256: 90582f405cb89a825a43297cdacc7f427ce04039a249f5f0fc75c95b50600b08
        nativeImagePath: graalvm-25.5.5.0.3+1.1/bin/native-image
      - os: linux
        arch: arm64
        url: https://gds.oracle.com/download/graal/25i5/archive/graalvm-jdk-25i5-25.0.5.0.3_linux-aarch64_bin.tar.gz
        sha256: c4e423cdbf21963329d4fb7846fdc2236dcd9cb3e996484d06c3b6d363b58a83
        nativeImagePath: graalvm-25.5.5.0.3+1.1/bin/native-image
      # GraalVM 25.0.1 is the last release supporting macOS x64.
      - os: macos
        arch: x64
        url: https://download.oracle.com/graalvm/25/archive/graalvm-jdk-25.0.1_macos-x64_bin.tar.gz
        sha256: a762ca1d9a163e32790b9286f3af4c16369729ff27999d8dbab60d7be16cff2f
        nativeImagePath: graalvm-jdk-25.0.1+8.1/Contents/Home/bin/native-image
      - os: macos
        arch: arm64
        url: https://gds.oracle.com/download/graal/25i5/archive/graalvm-jdk-25i5-25.0.5.0.3_macos-aarch64_bin.tar.gz
        sha256: 3c51d8ef62c63eb8454727f32d67aaff39afabe4c90b3c811c11547029c10819
        nativeImagePath: graalvm-25.5.5.0.3+1.1/Contents/Home/bin/native-image
      - os: windows
        arch: x64
        url: https://gds.oracle.com/download/graal/25i5/archive/graalvm-jdk-25i5-25.0.5.0.3_windows-x64_bin.zip
        sha256: dc28ad6ea38a24768c10571b47fbee84318f0f0c64883237efbba26cfc5cede0
        nativeImagePath: graalvm-25.5.5.0.3+1.1/bin/native-image.cmd
  # provisions the hermetic Node.js distribution the tests run npm with, before the tests are compiled.
  # sha256 values from https://nodejs.org/dist/v22.22.2/SHASUMS256.txt
  node:
    enabled: true
    version: 22.22.2
    distributionDirectory: build/node/dist
    generatedResourcesDirectory: build/node/generated-resources
    distributions:
      - os: linux
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.gz
        sha256: 978978a635eef872fa68beae09f0aad0bbbae6757e444da80b570964a97e62a3
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: linux
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-arm64.tar.gz
        sha256: b2f3a96f31486bfc365192ad65ced14833ad2a3c2e1bcefec4846902f264fa28
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: macos
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-x64.tar.gz
        sha256: 12a6abb9c2902cf48a21120da13f87fde1ed1b71a13330712949e8db818708ba
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: macos
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-arm64.tar.gz
        sha256: db4b275b83736df67533529a18cc55de2549a8329ace6c7bcc68f8d22d3c9000
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: windows
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-win-x64.zip
        sha256: 7c93e9d92bf68c07182b471aa187e35ee6cd08ef0f24ab060dfff605fcc1c57c
        nodePath: node.exe
        npmCliJsPath: node_modules/npm/bin/npm-cli.js
      - os: windows
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-win-arm64.zip
        sha256: 380d375cf650c5a7f2ef3ce29ac6ea9a1c9d2ec8ea8e8391e1a34fd543886ab3
        nodePath: node.exe
        npmCliJsPath: node_modules/npm/bin/npm-cli.js
