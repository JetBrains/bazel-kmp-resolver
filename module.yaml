product:
  type: jvm/app
dependencies:
  - $libs.clikt.jvm
  - $libs.logback.core
  - $libs.logback.classic
  - $libs.slf4j.api
  - $libs.dependency.resolution
  - $libs.async.processes
  - $libs.kotlinx.coroutines.core.jvm
  - $libs.kotlinx.serialization.core.jvm
  - $libs.kotlinx.serialization.json.jvm
test-dependencies:
  - $kotlin.test
repositories:
  - https://packages.jetbrains.team/maven/p/amper/amper
settings:
  kotlin:
    version: 2.4.0
    serialization: json
plugins:
  # `./kotlin do format` runs the ktfmt native binary (kotlinlang style) over the Kotlin sources. ktfmt publishes no
  # binary for linux-arm64 or macos-x64: formatting fails there.
  # sha256 values from the .sha256 assets of https://github.com/Kotlin/ktfmt/releases/tag/v0.65
  format:
    enabled: true
    ktfmt:
      version: "0.65"
      archives:
        - os: linux
          arch: x64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-linux-x86_64-0.65.tar.gz
          sha256: 3684327b092db9b76fffcb9525decf73f8331ed17e00ce3232769c11cd36d352
          executablePath: ktfmt-linux-x86_64-0.65/ktfmt
        - os: macos
          arch: arm64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-macos-aarch64-0.65.tar.gz
          sha256: d10ec46dadc4ae19e5b8ddc72d10ce45e5be35d632ce9e73c9b8a59d2147fb85
          executablePath: ktfmt-macos-aarch64-0.65/ktfmt
        - os: windows
          arch: x64
          url: https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-windows-x86_64-0.65.zip
          sha256: 3286d659fa8df6a480e3b53ca4a30d9321c372286c46b8d74556b434189bee5f
          executablePath: ktfmt-windows-x86_64-0.65/ktfmt.exe
    directories:
      - src
      - test
      - build-sources
  native-image:
    enabled: true
    graalVmVersion: 24.0.2
    mainClass: org.jetbrains.kmp.resolver.MainKt
    outputDirectory: build/native-image
    archives:
      - os: linux
        arch: x64
        url: https://download.oracle.com/graalvm/24/archive/graalvm-jdk-24.0.2_linux-x64_bin.tar.gz
        sha256: b0161a49bbc1d0f40697532ddfabb8052a5a15e463775e6945fe3e4920259bae
        nativeImagePath: graalvm-jdk-24.0.2+11.1/bin/native-image
      - os: linux
        arch: arm64
        url: https://download.oracle.com/graalvm/24/archive/graalvm-jdk-24.0.2_linux-aarch64_bin.tar.gz
        sha256: 76f2557f32e8cfbe6d8b7bbf331f0f092ebbe1cc36a2678e098305892076298b
        nativeImagePath: graalvm-jdk-24.0.2+11.1/bin/native-image
      - os: macos
        arch: x64
        url: https://download.oracle.com/graalvm/24/archive/graalvm-jdk-24.0.2_macos-x64_bin.tar.gz
        sha256: df0f9e5d101201c50bfa6baa3c657a81a2883c5b5097a9f5ab93dab86f7e3ba2
        nativeImagePath: graalvm-jdk-24.0.2+11.1/Contents/Home/bin/native-image
      - os: macos
        arch: arm64
        url: https://download.oracle.com/graalvm/24/archive/graalvm-jdk-24.0.2_macos-aarch64_bin.tar.gz
        sha256: 2dc7634ed939c725d41a353f73443ff32e70f2fb577367f12a6936107e3494dc
        nativeImagePath: graalvm-jdk-24.0.2+11.1/Contents/Home/bin/native-image
      - os: windows
        arch: x64
        url: https://download.oracle.com/graalvm/24/archive/graalvm-jdk-24.0.2_windows-x64_bin.zip
        sha256: a70785104855c181f2b56993d117e0e991eab6bd6dde99c32c2c5af857756653
        nativeImagePath: graalvm-jdk-24.0.2+11.1/bin/native-image.cmd
  # provisions the hermetic Node.js distribution the tests run npm with, before the tests are compiled.
  # sha256 values from https://nodejs.org/dist/v22.22.2/SHASUMS256.txt
  node:
    enabled: true
    version: 22.22.2
    distributionDirectory: build/node/dist
    generatedResourcesDirectory: build/node/generated-resources
    distributions:
      - os: linux
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-x64.tar.gz
        sha256: 978978a635eef872fa68beae09f0aad0bbbae6757e444da80b570964a97e62a3
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: linux
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-linux-arm64.tar.gz
        sha256: b2f3a96f31486bfc365192ad65ced14833ad2a3c2e1bcefec4846902f264fa28
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: macos
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-x64.tar.gz
        sha256: 12a6abb9c2902cf48a21120da13f87fde1ed1b71a13330712949e8db818708ba
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: macos
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-darwin-arm64.tar.gz
        sha256: db4b275b83736df67533529a18cc55de2549a8329ace6c7bcc68f8d22d3c9000
        nodePath: bin/node
        npmCliJsPath: lib/node_modules/npm/bin/npm-cli.js
      - os: windows
        arch: x64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-win-x64.zip
        sha256: 7c93e9d92bf68c07182b471aa187e35ee6cd08ef0f24ab060dfff605fcc1c57c
        nodePath: node.exe
        npmCliJsPath: node_modules/npm/bin/npm-cli.js
      - os: windows
        arch: arm64
        url: https://nodejs.org/dist/v22.22.2/node-v22.22.2-win-arm64.zip
        sha256: 380d375cf650c5a7f2ef3ce29ac6ea9a1c9d2ec8ea8e8391e1a34fd543886ab3
        nodePath: node.exe
        npmCliJsPath: node_modules/npm/bin/npm-cli.js
