name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore or save Node.js distribution cache
        uses: actions/cache@v6
        with:
          path: build/node
          key: node-${{ hashFiles('module.yaml') }}
      - name: Restore or save download cache (ktfmt)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/format-cache/downloads
          key: format-${{ hashFiles('module.yaml') }}
      - name: Check formatting
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/format-cache
        run: |
          ./kotlin do format
          git diff --exit-code
      - name: Run tests
        run: ./kotlin test

  graalvm-native-image-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore or save GraalVM archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/graalvm-native-image-cache/downloads
          key: graalvm-native-image-${{ hashFiles('module.yaml') }}
          enableCrossOsArchive: true
      - name: Download GraalVM archives
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
        shell: bash
        run: ./kotlin do cacheGraalVmArchives

  native-image:
    needs:
      - test
      - graalvm-native-image-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            executable_extension: ""
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable_extension: ""
          - platform: macos-x64
            runner: macos-15-intel
            executable_extension: ""
          - platform: macos-arm64
            runner: macos-15
            executable_extension: ""
          - platform: windows-x64
            runner: windows-2025
            executable_extension: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore GraalVM archive cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/graalvm-native-image-cache/downloads
          key: graalvm-native-image-${{ hashFiles('module.yaml') }}
          enableCrossOsArchive: true
      - name: Build native image
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
        shell: bash
        run: ./kotlin do buildNativeImage
      - name: Test native binary
        env:
          BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
        shell: bash
        run: ./kotlin do testNativeImage
      - name: Upload native binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bazel-kmp-resolver-${{ matrix.platform }}
          path: build/native-image/bazel-kmp-resolver-${{ matrix.platform }}${{ matrix.executable_extension }}
          if-no-files-found: error
          retention-days: 7

  bazel-integration:
    needs:
      - test
      - graalvm-native-image-cache
    strategy:
      fail-fast: false
      matrix:
        bazel_version:
          - "9.0.0"    # facts requirement
          - "9.3.3"
    runs-on: ubuntu-24.04
    env:
      BAZEL_KMP_RESOLVER_CACHE_DIR: ${{ runner.temp }}/graalvm-native-image-cache
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Restore GraalVM archive cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/graalvm-native-image-cache/downloads
          key: graalvm-native-image-${{ hashFiles('module.yaml') }}
          enableCrossOsArchive: true
      - name: Build native image
        shell: bash
        run: ./kotlin do buildNativeImage
      - name: Starlark unit tests
        shell: bash
        working-directory: rules_kotlin_external
        run: bazel test //tests/...
      - name: Stage the local resolver into the examples
        shell: bash
        run: rules_kotlin_external/examples/stage-local-resolver.sh
      - name: Build the examples
        shell: bash
        run: |
          cd rules_kotlin_external/examples/jvm
          bazel build //:app @kmp_deps_jvm//:org_jetbrains_kotlinx_kotlinx_coroutines_core
          cd ../wasmjs
          bazel build @kmp_deps_wasmjs//:org_jetbrains_kotlinx_kotlinx_datetime
          cd ../native
          bazel build \
            @kmp_deps_ios_arm64//:co_touchlab_sqliter_driver \
            @kmp_deps_ios_arm64//:co_touchlab_sqliter_driver_iosarm64_1_4_0_cinterop_0 \
            @kmp_deps_macos_arm64//:org_jetbrains_kotlinx_kotlinx_coroutines_core
          cd ../android
          bazel build \
            @kmp_deps_android//:androidx_annotation_annotation_experimental \
            @kmp_deps_android//:androidx_annotation_annotation \
            @kmp_deps_android//:org_jetbrains_compose_runtime_runtime
      - name: Facts caching behavior
        shell: bash
        run: rules_kotlin_external/examples/facts-behavior.sh
